name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.12.2"

  cross-build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: cross-build linux stub
        run: |
          GOOS=linux CGO_ENABLED=0 go build ./...
          GOOS=linux CGO_ENABLED=0 go vet ./...
