version: 2

project_name: bb

builds:
  - main: ./cmd/bb
    binary: bb
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/avitsrimer/bitbucket-cli/internal/cmd.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "bb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - repository:
      owner: avitsrimer
      name: homebrew-apps
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # cask token, deliberately NOT "bb": homebrew/cask ships its own `bb` cask, and an official
    # tap wins over a third-party one for the same token — `brew upgrade` silently replaced this
    # tool with that app (they even share /opt/homebrew/Caskroom/bb). The installed command is
    # still `bb`; only the cask is addressed as bitbucket-cli.
    name: bitbucket-cli
    binaries: [bb]
    directory: Casks
    homepage: "https://github.com/avitsrimer/bitbucket-cli"
    description: "Command-line interface to manage Bitbucket pull requests, profiles, and users"
    # the binary is unsigned/ad-hoc, so a downloaded cask is Gatekeeper-quarantined;
    # strip the quarantine attribute on install so `bb` runs without manual xattr.
    #
    # Emitted through custom_block rather than hooks.post.install: GoReleaser renders that hook as
    # a `postflight do` block, which Homebrew deprecated in favour of the declarative
    # `postflight_steps` DSL, and GoReleaser has no knob for the new stanza (still hardcoded in its
    # cask template as of v2.16). Braces are escaped because custom_block is run through
    # GoReleaser's own template engine first; Homebrew expands `{{staged_path}}` itself.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/bb"]
        end
      end
